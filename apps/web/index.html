<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%230a0a0b'/%3E%3Cpath d='M16 4a12 12 0 0 0 0 24 15 15 0 0 1 0-24z' fill='%23facc15'/%3E%3C/svg%3E" />
    <title>Candor — Verified, unlinkable comp truth</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <meta name="description" content="Candor: verified, unlinkable, aggregate-only compensation truth for crypto-native tech workers." />
  </head>
  <body>
    <div id="root"><div style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#0a0a0b;color:#f5f5f4;font-family:Inter,system-ui,sans-serif"><div style="text-align:center"><div style="width:32px;height:32px;border:3px solid #26262b;border-top-color:#facc15;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 16px"></div><div style="color:#a1a1aa">Loading Candor…</div></div></div><style>@keyframes spin{to{transform:rotate(360deg)}}</style></div>
    <script>
      // Never-blank guarantee: if the app bundle fails to boot (blocked WASM,
      // strict security modes, network hiccup), show a helpful fallback panel
      // instead of an empty page.
      (function () {
        var shown = false;
        function fallback(reason) {
          if (shown) return;
          shown = true;
          var root = document.getElementById("root");
          if (!root || root.hasChildNodes()) return;
          root.innerHTML =
            '<div style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#0a0a0b;color:#f5f5f4;font-family:Inter,system-ui,sans-serif">' +
            '<div style="max-width:560px;border:1px solid #26262b;border-radius:14px;padding:24px;background:#121214">' +
            '<h2 style="margin:0 0 10px">Candor could not fully load</h2>' +
            '<p style="color:#a1a1aa;line-height:1.5">' + reason + '</p>' +
            '<p style="color:#a1a1aa;line-height:1.5">Candor uses WebAssembly for zero-knowledge proofs. If your browser (or an extension / enhanced-security mode) blocks it, allow WASM for this site or open the page in Chrome.</p>' +
            '<button onclick="location.reload()" style="background:#facc15;color:#0a0a0b;border:0;border-radius:10px;padding:10px 18px;font-weight:700;cursor:pointer">Reload</button>' +
            "</div></div>";
        }
        window.addEventListener("error", function (e) {
          fallback(e.message ? String(e.message).slice(0, 200) : "A required component failed to load.");
        });
        window.addEventListener("unhandledrejection", function (e) {
          fallback(e.reason ? String(e.reason).slice(0, 200) : "Unexpected error during startup.");
        });
        setTimeout(function () {
          var root = document.getElementById("root");
          if (root && !root.hasChildNodes()) fallback("The application took too long to start. Please check your connection and reload.");
        }, 5000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
