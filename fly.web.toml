app = "candor-midnight-web"
primary_region = "iad"

[build]
  dockerfile = "deploy/web.Dockerfile"

  [build.args]
    VITE_CONTRACT_ADDRESS = "e7cf6ffc48ebeb450813104e6a5ab3d585f7e275bcd32e5ea82eb7a8c21dd53d"
    VITE_ISSUER_KEY = "9aa3811d959df5e7f924d7d487bb4611509bb286181f85144a2cc2c203b2ef1e"
    VITE_HOSTED_PROVER = "true"

[env]
  ISSUER_URL = "https://candor-midnight-issuer.fly.dev"
  ISSUER_HOST = "candor-midnight-issuer.fly.dev"
  # Official Preprod indexer, API v4. The previous upstream
  # (blockfrost.lw.iog.io) now returns 410 Gone for Midnight endpoints.
  INDEXER_URL = "https://indexer.preprod.midnight.network"
  INDEXER_HOST = "indexer.preprod.midnight.network"
  PROOF_SERVER_URL = "https://candor-midnight-prover.fly.dev"
  PROOF_SERVER_HOST = "candor-midnight-prover.fly.dev"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
